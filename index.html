<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f2a1d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fútbol 7">
  <title>Fútbol 7 Rotaciones</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">⚽</span> <span id="team-name">Fútbol 7</span></div>
  </header>

  <main id="app" aria-live="polite"></main>
  <div id="modal-root"></div>

  <nav class="tabbar">
    <button data-action="tab" data-tab="match" class="tab"><span>⏱️</span>Partido</button>
    <button data-action="tab" data-tab="squad" class="tab"><span>👥</span>Plantilla</button>
    <button data-action="tab" data-tab="stats" class="tab"><span>📊</span>Estadísticas</button>
    <button data-action="tab" data-tab="settings" class="tab"><span>⚙️</span>Ajustes</button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
